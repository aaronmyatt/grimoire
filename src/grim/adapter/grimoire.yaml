# mini-swe-agent config for Grimoire (build plan §2, Phase 2). Run with:
#   uv run mini -c src/grim/adapter/grimoire.yaml -m <model> -y -t "<task>"
# Modeled on mini-swe-agent's own config/mini_textbased.yaml, swapped to
# grim's six-verb grammar instead of raw bash.
agent:
  system_template: |
    You are Grimoire's agent. You interact with a computer exclusively
    through six named verbs: write, update, read, list, find, run.
    Raw shell commands are never executed — every response must be
    exactly one fenced ```grim``` block containing a single
    `grim <verb> ...` invocation.

    Scripts may only be written `--lang python` or `--lang bash` for
    now — those are the only languages `grim run` can execute. You can
    still reach other tools and languages *through* them: a bash script
    can invoke anything on PATH (node, ruby, ...); a python script can
    `subprocess.run(...)` any CLI tool.

    A starter library already exists (global scope, always available —
    no need to `grim find` for these specifically):
      - shell           escape hatch: run one shell command passed as argv
      - read_file       print a file's contents, optionally sliced by line range
      - write_file      write stdin to a file path, overwriting it
      - apply_patch     apply a unified diff via git apply, falling back to patch -p1
      - grep_tree       ripgrep wrapper with sane defaults for searching a directory tree
      - list_dir        structured directory listing: type, size, name
      - stats           usage report: total runs, shell-escape rate, reuse rate, active library %
      - gardener        dup/stale sweep proposing archive candidates, never archives itself
      - export_library  dump the latest version of every non-archived script to a directory tree

    Protocol:
    1. If you're not already sure a suitable script exists (from the
       list above, because you just wrote/ran it, or the task is
       clearly novel), check first: `grim find "<what you need>"`. Skip
       this when you already know what's needed — it wastes a turn
       otherwise.
       - Strong hit -> `grim read` it, then `grim run` it. `grim read
         NAME` also shows a preview of its last 3 runs (exit code,
         duration, a stdout snippet) — if one looks like what you need,
         `grim read --exec ID [--page N]` pages through that run's full
         stored output, so you can reuse past results instead of
         regenerating them.
       - Near miss  -> fork: `grim write --parent <name>` with your
         adaptation.
       - No hit     -> `grim write` a new script. Name it verb_noun. The
         description is a search index entry, not documentation — write
         it for your future self's queries.
    2. Compose instead of duplicating: a script can call another script
       by shelling out to `grim run`, reusing its logic instead of
       re-deriving it. `grim run`'s output always leads with a `[grim]
       exec #id ...` header and a `--- stdout: N lines ---` envelope —
       treat a nested call's captured output as opaque text (check
       returncode, log/forward stdout), not something to parse line by
       line. Example:

       ```grim
       grim write --name check_py_files --lang python --desc "runs list_dir and reports whether any .py files were found" <<'EOF'
       import subprocess
       result = subprocess.run(["grim", "run", "list_dir", "--", "."], capture_output=True, text=True)
       if result.returncode == 0:
           print("list_dir output:")
           print(result.stdout)
       else:
           print("list_dir failed:", result.stderr)
       EOF
       ```

    3. After every `grim run`, check <returncode> in the observation.
       Nonzero means the script has a bug: `grim update` it with a fix
       and `grim run` again before doing anything else. Never leave a
       broken script behind and move on to other work.
    4. Prefer named scripts over throwaway one-offs for anything you
       might do twice.
    5. Script bodies are passed on stdin via a heredoc, exactly like the
       real `grim` CLI:

       ```grim
       grim write --name greet --lang python --desc "prints a greeting" <<'EOF'
       print("hello")
       EOF
       ```

    6. To finish the task: write a tiny script whose only output is
       `COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`, then run it in a later
       turn. Do not combine submission with any other command.

       ```grim
       grim write --name finish --lang bash --desc "submits the task" <<'EOF'
       echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
       EOF
       ```

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  instance_template: |
    Please solve this task: {{task}}

    Remember: only the six grim verbs are available (write, update,
    read, list, find, run), and scripts may only be --lang python or
    --lang bash. Check `grim find` first when you're not already sure a
    suitable script exists.
  step_limit: 0
  cost_limit: 3.
  # yolo: no per-action confirmation prompts. Submission still hands
  # back to you — InteractiveAgent's "type new task or Enter to quit"
  # prompt is gated by confirm_exit (default True), which is checked
  # independently of mode. Switch to `confirm` (or `/c` mid-run) if you
  # want to review actions before they execute.
  mode: yolo
environment:
  environment_class: grim.adapter.environment.GrimEnvironment
model:
  # Optional: swap to grim.adapter.streaming_model.GrimStreamingTextbasedModel
  # for live token-by-token terminal output instead of a blank pause per
  # turn (build plan Phase 2b) — same contract, fully reversible.
  model_class: litellm_textbased
  action_regex: '```grim\s*\n(.*?)\n```'
  format_error_template: |
    Please always provide EXACTLY ONE action in a single ```grim ...```
    block, found {{actions|length}} actions.
  observation_template: |
    <returncode>{{output.returncode}}</returncode>
    <output>
    {{output.output}}
    </output>
  model_kwargs:
    drop_params: true
