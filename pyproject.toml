[project]
name = "grimoire"
version = "0.1.0"
description = "A script-hoarding agent harness on mini-swe-agent."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
grim = "grim.cli:main"

[project.optional-dependencies]
adapter = [
    "mini-swe-agent>=2.4,<3",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grim"]

# Ref: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100  # budgets.json .budgets.lineWidth
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (correctness, includes E501 line-too-long).
# I: isort (import order). C90: mccabe complexity. PLR: pylint-refactor
# subset — the closest native ruff rules to max-params/max-statements.
select = ["E", "F", "I", "C90", "PLR"]

# Ref: https://docs.astral.sh/ruff/rules/#mccabe-c90
[tool.ruff.lint.mccabe]
max-complexity = 10  # budgets.json .budgets.cyclomaticComplexity

# Ref: https://docs.astral.sh/ruff/rules/#pylint-pl
[tool.ruff.lint.pylint]
max-args = 4       # budgets.json .budgets.maxParams
max-statements = 60  # budgets.json .budgets.functionLines — ruff has no
                     # literal per-function line-count rule; statement
                     # count is the closest native proxy (PLR0915).

# Ref: https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Ref: https://docs.pytest.org/en/stable/reference/customize.html
[tool.pytest.ini_options]
testpaths = ["src"]

# Ref: https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
source = ["src/grim"]

[tool.coverage.report]
fail_under = 0  # budgets.json .budgets.coveragePercent — today's real
                # number; raising it is a /ratchet job, never a hand-edit.
