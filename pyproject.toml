[project]
name = "grimoire"
version = "0.1.0"
description = "A script-hoarding agent harness on mini-swe-agent."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
grim = "grim.cli:main"
# The installable yolo-mode harness (like `mini`/`pi`): one command runs the
# agent loop. Lives in the adapter slice; needs the `agent` extra below.
grim-agent = "grim.adapter.launcher:main"

[project.optional-dependencies]
# Public-facing name: `uv tool install "grimoire[agent]"` installs what the
# `grim-agent` harness needs (mini-swe-agent). The slice implementing it stays
# internally named `adapter/`; the extra says what you get, not how.
agent = [
    "mini-swe-agent>=2.4,<3",
    # Cap litellm below 1.95: 1.95+ ships a native Rust extension (pyo3/
    # maturin) with no CPython 3.14 wheel yet, so a fresh resolver (e.g.
    # `uv tool install`, which ignores uv.lock) builds it from source and
    # fails unless rustc >= 1.94.1 is present. Keeping it <1.95 stays on the
    # pure-Python line so the harness installs with no toolchain. Drop this
    # cap once litellm publishes 3.14 wheels. (litellm arrives transitively
    # via mini-swe-agent; pinned here because it's the one that breaks builds.)
    "litellm<1.95",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grim"]

# Ref: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100  # budgets.json .budgets.lineWidth
target-version = "py312"
# Vendored third-party eval fixtures (QuixBugs, HumanEvalFix, ARC-AGI) are
# committed verbatim — their bugs and formatting ARE the task data, so they
# are excluded from format/lint rather than "fixed."
# Ref: https://docs.astral.sh/ruff/settings/#extend-exclude
extend-exclude = ["evals/*/tasks/files"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (correctness, includes E501 line-too-long).
# I: isort (import order). C90: mccabe complexity. PLR: pylint-refactor
# subset — the closest native ruff rules to max-params/max-statements.
select = ["E", "F", "I", "C90", "PLR"]

# Ref: https://docs.astral.sh/ruff/rules/#mccabe-c90
[tool.ruff.lint.mccabe]
max-complexity = 10  # budgets.json .budgets.cyclomaticComplexity

# Ref: https://docs.astral.sh/ruff/rules/#pylint-pl
[tool.ruff.lint.pylint]
max-args = 4       # budgets.json .budgets.maxParams
max-statements = 60  # budgets.json .budgets.functionLines — ruff has no
                     # literal per-function line-count rule; statement
                     # count is the closest native proxy (PLR0915).

# Ref: https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Ref: https://docs.pytest.org/en/stable/reference/customize.html
[tool.pytest.ini_options]
testpaths = ["src"]

# Ref: https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
source = ["src/grim"]

[tool.coverage.report]
fail_under = 0  # budgets.json .budgets.coveragePercent — today's real
                # number; raising it is a /ratchet job, never a hand-edit.
