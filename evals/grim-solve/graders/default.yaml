name: default
# One required check: the answer must parse to exactly the expected grid.
# Grader schema: https://github.com/prime-radiant-inc/smevals  (`smevals docs`)
checks:
  # Observer FIRST (constant score 1.0, always exit 0): harvests experiment
  # metrics — cost/steps/format errors + session-scoped escape/reuse — into
  # this grade's metrics block. Listed before the required check because
  # smevals skips remaining checks once a required one fails, and failing
  # runs are exactly the ones whose metrics a comparison needs.
  - checker: ../checkers/run-metrics
    required: false
  - checker: ../checkers/json-grid-equals
    required: true
scoring:
  pass_threshold: 1.0
