name: np-cal-2p
kind: calendar
source_id: calendar_scheduling_example_500
golden: 'Here is the proposed time: Monday, 14:30 - 15:00'
prompt: "You are an expert at scheduling meetings. You are given a few constraints on the existing schedule\
  \ of each participant, the meeting duration, and possibly some preferences on the meeting time. Note\
  \ there exists a solution that works with existing schedule of every participant. Here are a few example\
  \ tasks and solutions:\n\nTASK: You need to schedule a meeting for Rachel and Wayne for half an hour\
  \ between the work hours of 9:00 to 17:00 on Monday. \n\nHere are the existing schedules for everyone\
  \ during the day: \nRachel is busy on Monday during 12:00 to 12:30, 14:00 to 14:30, 15:30 to 16:00,\
  \ 16:30 to 17:00; \nWayne has blocked their calendar on Monday during 9:00 to 9:30, 10:00 to 10:30,\
  \ 11:00 to 14:30, 15:00 to 15:30, 16:00 to 17:00; \n\nRachel would rather not meet on Monday before\
  \ 13:00. Find a time that works for everyone's schedule and constraints. \nSOLUTION: \n(Format the solution\
  \ exactly as: Here is the proposed time: Monday, 14:30 - 15:00)"
