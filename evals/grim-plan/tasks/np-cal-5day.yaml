prompt: "You are an expert at scheduling meetings. You are given a few constraints on the existing schedule\
  \ of each participant, the meeting duration, and possibly some preferences on the meeting time. Note\
  \ there exists a solution that works with existing schedule of every participant. Here are a few example\
  \ tasks and solutions:\n\nTASK: You need to schedule a meeting for Jeremy and Lori for one hour between\
  \ the work hours of 9:00 to 17:00 on either Monday, Tuesday, Wednesday, Thursday or Friday. \n\nHere\
  \ are the existing schedules for everyone during the days: \nJeremy has meetings on Monday during 12:00\
  \ to 13:30, 14:30 to 16:30, Tuesday during 9:00 to 10:00, 11:00 to 11:30, 14:00 to 14:30, 16:00 to 17:00,\
  \ Wednesday during 10:00 to 10:30, 11:30 to 12:00, 16:00 to 16:30, Thursday during 9:30 to 10:00, 10:30\
  \ to 11:00, 11:30 to 12:00, 12:30 to 13:00, 13:30 to 14:00, 15:00 to 16:00, 16:30 to 17:00, Friday during\
  \ 9:00 to 9:30, 16:30 to 17:00; \nLori is busy on Monday during 14:30 to 17:00, Tuesday during 9:00\
  \ to 11:00, 11:30 to 13:00, 13:30 to 14:30, 15:00 to 17:00, Wednesday during 9:00 to 10:00, 10:30 to\
  \ 13:30, 14:00 to 17:00, Thursday during 9:00 to 11:30, 12:30 to 17:00, Friday during 9:30 to 13:00,\
  \ 13:30 to 15:30, 16:30 to 17:00; \n\nLori would like to avoid more meetings on Friday. The group would\
  \ like to meet at their earlist availability.\nFind a time that works for everyone's schedule and constraints.\
  \ \nSOLUTION: \n(Format the solution exactly as: Here is the proposed time: Monday, 14:30 - 15:00)"
